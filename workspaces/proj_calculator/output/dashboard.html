<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omnintellx Python Calculator — Telemetry & Test Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="bg-[#090D14] text-slate-200 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
      <div>
        <h1 class="text-lg font-bold text-emerald-400">Omnintellx Live Telemetry Dashboard</h1>
        <p class="text-xs text-slate-500">Omnintellx Python Calculator • Verified Production Artifacts</p>
      </div>
      <span class="px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-400 text-xs font-bold">HEALTH: 100% OK</span>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
        <div class="text-[11px] text-slate-500 uppercase">Unit Tests</div>
        <div class="text-2xl font-bold text-emerald-400 mt-1">5/5</div>
        <div class="text-[10px] text-emerald-500 mt-0.5">100% Passed</div>
      </div>
      <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
        <div class="text-[11px] text-slate-500 uppercase">Execution Latency</div>
        <div class="text-2xl font-bold text-indigo-400 mt-1">1.0ms</div>
        <div class="text-[10px] text-indigo-300 mt-0.5">0.001s Total</div>
      </div>
      <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
        <div class="text-[11px] text-slate-500 uppercase">Vulnerabilities</div>
        <div class="text-2xl font-bold text-slate-100 mt-1">0</div>
        <div class="text-[10px] text-emerald-400 mt-0.5">OWASP Verified</div>
      </div>
      <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
        <div class="text-[11px] text-slate-500 uppercase">Build Target</div>
        <div class="text-lg font-bold text-amber-400 mt-1">Zero-Dep</div>
        <div class="text-[10px] text-slate-400 mt-0.5">Single HTML</div>
      </div>
    </div>
  </div>
</body>
</html>
